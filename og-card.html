<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{width:1200px; height:630px; background:#f3f2ee; font-family:Georgia, serif; overflow:hidden;}
  .card{width:1200px; height:630px; background:linear-gradient(160deg,#e6f2ea 0%,#f3f2ee 48%,#fbe9ef 100%); display:flex; flex-direction:column; justify-content:center; padding:74px 84px; position:relative;}
  .k{display:inline-block; background:#fbe9ef; color:#b03d64; font-family:Arial, sans-serif; font-weight:700; font-size:19px; letter-spacing:.14em; text-transform:uppercase; padding:9px 16px; margin-bottom:30px; width:max-content;}
  h1{font-size:78px; line-height:1.05; color:#22251f; max-width:820px; margin-bottom:22px;}
  p{font-family:Arial, sans-serif; font-size:26px; color:#5d635a; max-width:760px;}
  .bars{position:absolute; top:74px; right:84px;}
  .foot{position:absolute; bottom:56px; left:84px; font-family:Arial, sans-serif; font-size:19px; color:#1c5540; font-weight:700; letter-spacing:.04em;}
</style>
</head>
<body>
  <div class="card">
    <svg class="bars" width="120" height="120" viewBox="0 0 64 64"><rect width="64" height="64" fill="#2e7d5b"/><rect x="12" y="14" width="40" height="9" fill="#fffdfa"/><rect x="12" y="27" width="30" height="9" fill="#e78fae"/><rect x="12" y="40" width="36" height="9" fill="#fffdfa"/></svg>
    <div class="k">Free agent &middot; local-first</div>
    <h1>Every lesson, in steps that can be finished.</h1>
    <p>Lesson Chunks Agent turns any lesson into small steps, builds an offline lesson file, and can deliver the chunks before the test.</p>
    <div class="foot">LESSONCHUNKS.DISTINCTOAPPS.COM</div>
  </div>
</body>
</html>
